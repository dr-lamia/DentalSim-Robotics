schema_version: 1
review_type: dental_preparation_target_mesh
required_fields:
  - reviewer_id
  - reviewer_role
  - review_date
  - case_id
  - fdi
  - candidate_version
  - mesh_sha256
  - criteria
  - overall_decision
criteria:
  correct_tooth_identity: {allowed: [pass, fail]}
  complete_visible_circumferential_boundary: {allowed: [pass, fail]}
  no_adjacent_tooth_contamination: {allowed: [pass, fail]}
  no_unacceptable_gingival_contamination: {allowed: [pass, fail]}
  axial_preparation_complete: {allowed: [pass, fail]}
  occlusal_preparation_complete: {allowed: [pass, fail]}
  suitable_for_geometric_target_scoring: {allowed: [pass, fail]}
overall_decision:
  allowed: [accept, accept_after_edit, reject]
promotion_rule:
  minimum_independent_reviewers: 2
  require_distinct_reviewer_ids: true
  require_same_mesh_sha256: true
  require_all_criteria_pass: true
  require_all_decisions_accept: true
