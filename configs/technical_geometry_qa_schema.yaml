schema_version: 1
review_type: technical_geometry_qa
required:
  - operator_id
  - review_date
  - case_id
  - fdi
  - candidate_version
  - mesh_sha256
  - source_expert_supervised
  - criteria
  - overall_decision
criteria:
  correct_tooth_identity: {allowed: [pass, fail]}
  complete_prepared_surface: {allowed: [pass, fail]}
  axial_surfaces_complete: {allowed: [pass, fail]}
  occlusal_surface_complete: {allowed: [pass, fail]}
  no_adjacent_tooth_contamination: {allowed: [pass, fail]}
  no_unacceptable_gingival_contamination: {allowed: [pass, fail]}
  scale_verified: {allowed: [pass, fail]}
  orientation_verified: {allowed: [pass, fail]}
  suitable_as_reference_geometry: {allowed: [pass, fail]}
overall_decision:
  allowed: [accept, accept_after_edit, reject]
promotion_rule:
  source_expert_supervised_required: true
  all_criteria_pass_required: true
  overall_decision_accept_required: true
  exact_mesh_sha256_required: true
